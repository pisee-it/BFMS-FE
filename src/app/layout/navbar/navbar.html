<header class="navbar" style="display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 4.5rem; background: var(--bg-app); backdrop-filter: blur(40px) saturate(180%); border-bottom: 1px solid var(--border-ui); position: sticky; top: 0; z-index: 40; transition: background 0.3s ease, border-color 0.3s ease;">
  <!-- Left Area -->
  <div style="display: flex; align-items: center; gap: 2rem;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="color: var(--text-muted); font-size: 14px; font-weight: 500;">Home</span>
      <lucide-angular [img]="ArrowIcon" [size]="14" style="color: var(--text-muted);"></lucide-angular>
      <span style="color: var(--text-main); font-size: 14px; font-weight: 600;">Tổng quan</span>
    </div>

    <div class="search-box">
      <lucide-angular [img]="SearchIcon" [size]="18" style="color: var(--text-muted);"></lucide-angular>
      <input type="text" placeholder="Tìm kiếm nhanh..." style="background: transparent; border: none; color: var(--text-main); outline: none; margin-left: 10px;" />
    </div>
  </div>

  <!-- Right Area -->
  <div style="display: flex; align-items: center; gap: 1rem;">
    <!-- Theme Toggle -->
    <button class="icon-btn" (click)="toggleTheme()" [title]="currentTheme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <lucide-angular [img]="currentTheme() === 'dark' ? SunIcon : MoonIcon" [size]="20"></lucide-angular>
    </button>

    <button class="icon-btn">
      <lucide-angular [img]="BellIcon" [size]="20"></lucide-angular>
      @if (notificationsCount() > 0) {
        <span class="badge">{{ notificationsCount() }}</span>
      }
    </button>

    <div style="position: relative;">
      <div (click)="toggleUserMenu()" style="display: flex; align-items: center; gap: 1rem; cursor: pointer; padding: 6px 12px; border-radius: 12px; transition: background 0.3s;">
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-size: 14px; font-weight: 700; color: var(--text-main);">Quản trị viên</span>
          <span style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Administrator</span>
        </div>
        <div class="avatar">
          <lucide-angular [img]="UserIcon" [size]="24" style="color: var(--text-main);"></lucide-angular>
        </div>
      </div>

      <!-- Dropdown -->
      @if (isUserMenuOpen()) {
        <div class="dropdown-menu animate-fade-in" style="position: absolute; top: 100%; right: 0; width: 200px; background: var(--card-bg); border: 1px solid var(--border-ui); border-radius: 12px; padding: 8px; z-index: 100; margin-top: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
          <button class="dropdown-item" style="width: 100%; text-align: left; background: transparent; border: none; color: var(--text-muted); padding: 10px; cursor: pointer; border-radius: 8px; transition: all 0.2s;">
            Hồ sơ cá nhân
          </button>
          <div style="height: 1px; background: var(--border-ui); margin: 4px 0;"></div>
          <button class="dropdown-item" [routerLink]="['/login']" style="width: 100%; text-align: left; background: transparent; border: none; color: #ef4444; padding: 10px; cursor: pointer; border-radius: 8px; transition: all 0.2s;">
            Đăng xuất
          </button>
        </div>
        <div (click)="closeUserMenu()" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 90;"></div>
      }
    </div>
  </div>
</header>
