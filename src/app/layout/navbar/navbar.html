<header class="navbar flex items-center justify-between px-4 md:px-8 h-[4.5rem] sticky top-0 z-40 bg-[var(--bg-app)] backdrop-blur-[40px] border-b border-[var(--border-ui)]">
  <!-- Left Area -->
  <div class="flex items-center gap-4 md:gap-8">
    <!-- Mobile Menu Toggle -->
    <button class="icon-btn lg:hidden" (click)="toggleSidebar()">
      <lucide-angular [img]="MenuIcon" [size]="20"></lucide-angular>
    </button>

    <div class="hidden md:flex items-center gap-2.5">
      <span class="text-xs lg:text-sm text-[var(--text-muted)] font-medium">Home</span>
      <lucide-angular [img]="ArrowIcon" [size]="14" class="text-[var(--text-muted)]"></lucide-angular>
      <span class="text-xs lg:text-sm text-[var(--text-main)] font-semibold">Tổng quan</span>
    </div>

    <div class="search-box hidden sm:flex">
      <lucide-angular [img]="SearchIcon" [size]="18" class="text-[var(--text-muted)]"></lucide-angular>
      <input type="text" placeholder="Tìm kiếm nhanh..." class="bg-transparent border-none text-[var(--text-main)] outline-none ml-2.5 w-full text-sm" />
    </div>
  </div>

  <!-- Right Area -->
  <div class="flex items-center gap-2 md:gap-4">
    <!-- Theme Toggle -->
    <button class="icon-btn" (click)="toggleTheme()" [title]="currentTheme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <lucide-angular [img]="currentTheme() === 'dark' ? SunIcon : MoonIcon" [size]="20"></lucide-angular>
    </button>

    <button class="icon-btn">
      <lucide-angular [img]="BellIcon" [size]="20"></lucide-angular>
      @if (notificationsCount() > 0) {
        <span class="badge">{{ notificationsCount() }}</span>
      }
    </button>

    <div class="relative">
      <div (click)="toggleUserMenu()" class="flex items-center gap-2 md:gap-4 cursor-pointer p-1.5 md:p-2 rounded-xl transition-all hover:bg-white/5">
        <div class="hidden sm:flex flex-col items-end">
          <span class="text-sm font-bold text-[var(--text-main)]">Quản trị viên</span>
          <span class="text-[10px] font-bold text-[var(--text-muted)] uppercase">Administrator</span>
        </div>
        <div class="avatar shrink-0">
          <lucide-angular [img]="UserIcon" [size]="24" class="text-[var(--text-main)]"></lucide-angular>
        </div>
      </div>

      <!-- Dropdown -->
      @if (isUserMenuOpen()) {
        <div class="dropdown-menu animate-fade-in" style="position: absolute; top: 100%; right: 0; width: 200px; background: var(--card-bg); border: 1px solid var(--border-ui); border-radius: 12px; padding: 8px; z-index: 100; margin-top: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
          <button class="dropdown-item" style="width: 100%; text-align: left; background: transparent; border: none; color: var(--text-muted); padding: 10px; cursor: pointer; border-radius: 8px; transition: all 0.2s;">
            Hồ sơ cá nhân
          </button>
          <div style="height: 1px; background: var(--border-ui); margin: 4px 0;"></div>
          <button class="dropdown-item" [routerLink]="['/login']" style="width: 100%; text-align: left; background: transparent; border: none; color: #ef4444; padding: 10px; cursor: pointer; border-radius: 8px; transition: all 0.2s;">
            Đăng xuất
          </button>
        </div>
        <div (click)="closeUserMenu()" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 90;"></div>
      }
    </div>
  </div>
</header>
