<header class="navbar" style="display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 4.5rem; background: rgba(10, 10, 10, 0.4); backdrop-filter: blur(40px) saturate(180%); border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: sticky; top: 0; z-index: 40;">
  <!-- Left Area -->
  <div style="display: flex; align-items: center; gap: 2rem;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="color: #9ca3af; font-size: 14px; font-weight: 500;">Home</span>
      <lucide-angular [img]="ArrowIcon" [size]="14" style="color: #4b5563;"></lucide-angular>
      <span style="color: white; font-size: 14px; font-weight: 600;">Tổng quan</span>
    </div>

    <div class="search-box">
      <lucide-angular [img]="SearchIcon" [size]="18"></lucide-angular>
      <input type="text" placeholder="Tìm kiếm nhanh..." style="background: transparent; border: none; color: white; outline: none; margin-left: 10px;" />
    </div>
  </div>

  <!-- Right Area -->
  <div style="display: flex; align-items: center; gap: 1.5rem;">
    <button class="icon-btn">
      <lucide-angular [img]="BellIcon" [size]="20"></lucide-angular>
      <span class="badge"></span>
    </button>

    <div style="position: relative;">
      <div (click)="toggleUserMenu()" style="display: flex; align-items: center; gap: 1rem; cursor: pointer; padding: 6px 12px; border-radius: 12px; transition: background 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.04)'" onmouseout="this.style.background='transparent'">
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-size: 14px; font-weight: 700; color: white;">Quản trị viên</span>
          <span style="font-size: 10px; font-weight: 700; color: #6b7280; text-transform: uppercase;">Administrator</span>
        </div>
        <div class="avatar">
          <lucide-angular [img]="UserIcon" [size]="24" class="text-white"></lucide-angular>
        </div>
      </div>

      <!-- Dropdown -->
      @if (isUserMenuOpen()) {
        <div class="dropdown-menu animate-fade-in" style="position: absolute; top: 100%; right: 0; width: 200px; background: #141414; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px; z-index: 100; margin-top: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);">
          <button class="dropdown-item" style="width: 100%; text-align: left; background: transparent; border: none; color: #9ca3af; padding: 10px; cursor: pointer; border-radius: 8px;" onmouseover="this.style.background='rgba(255,255,255,0.05)'; this.style.color='white'" onmouseout="this.style.background='transparent'; this.style.color='#9ca3af'">
            Hồ sơ cá nhân
          </button>
          <div style="height: 1px; background: rgba(255,255,255,0.05); margin: 4px 0;"></div>
          <button class="dropdown-item" [routerLink]="['/login']" style="width: 100%; text-align: left; background: transparent; border: none; color: #ef4444; padding: 10px; cursor: pointer; border-radius: 8px;" onmouseover="this.style.background='rgba(239,68,68,0.05)'" onmouseout="this.style.background='transparent'">
            Đăng xuất
          </button>
        </div>
        <div (click)="closeUserMenu()" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 90;"></div>
      }
    </div>
  </div>
</header>
