<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Quản lý Đối tác Quảng cáo</h1>
    <p-button label="Thêm Đối tác" icon="pi pi-plus" (onClick)="openNew()" severity="primary"></p-button>
  </div>

  <div class="card bg-white/10 backdrop-blur-md border border-white/20 rounded-xl overflow-hidden">
    <p-table
      #dt
      [value]="companies()"
      [lazy]="true"
      (onLazyLoad)="loadCompanies($event)"
      [paginator]="true"
      [rows]="10"
      [totalRecords]="totalRecords()"
      [loading]="loading()"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="p-datatable-gridlines"
      [responsiveLayout]="'scroll'"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Tên Công ty <p-sortIcon field="name"></p-sortIcon></th>
          <th pSortableColumn="taxCode">Mã số Thuế <p-sortIcon field="taxCode"></p-sortIcon></th>
          <th>Liên hệ</th>
          <th style="width: 8rem">Thao tác</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-company>
        <tr>
          <td>{{ company.name }}</td>
          <td>{{ company.taxCode }}</td>
          <td>{{ company.contact }}</td>
          <td>
            <div class="flex gap-2">
              <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="editCompany(company)"></p-button>
              <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteCompany(company)"></p-button>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center p-4">Không tìm thấy đối tác nào.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog
    [(visible)]="companyDialog"
    [style]="{ width: '450px' }"
    header="Chi tiết Đối tác"
    [modal]="true"
    styleClass="p-fluid"
    (onHide)="hideDialog()"
  >
    <ng-template pTemplate="content">
      <form [formGroup]="companyForm">
        <div class="mb-4">
          <label for="name" class="block font-medium mb-2">Tên Công ty <span class="text-red-500">*</span></label>
          <input type="text" pInputText id="name" formControlName="name" required autofocus />
          <small class="text-red-500" *ngIf="submitted && companyForm.get('name')?.errors?.['required']">
            Tên công ty là bắt buộc.
          </small>
        </div>
        <div class="mb-4">
          <label for="taxCode" class="block font-medium mb-2">Mã số Thuế <span class="text-red-500">*</span></label>
          <input type="text" pInputText id="taxCode" formControlName="taxCode" required />
          <small class="text-red-500" *ngIf="submitted && companyForm.get('taxCode')?.errors?.['required']">
            Mã số thuế là bắt buộc.
          </small>
        </div>
        <div class="mb-4">
          <label for="contact" class="block font-medium mb-2">Thông tin Liên hệ</label>
          <input type="text" pInputText id="contact" formControlName="contact" />
        </div>
      </form>
    </ng-template>

    <ng-template pTemplate="footer">
      <p-button label="Hủy" icon="pi pi-times" [text]="true" (onClick)="hideDialog()"></p-button>
      <p-button label="Lưu" icon="pi pi-check" (onClick)="saveCompany()" severity="primary"></p-button>
    </ng-template>
  </p-dialog>

  <p-confirmDialog [style]="{ width: '450px' }"></p-confirmDialog>
  <p-toast></p-toast>
</div>
